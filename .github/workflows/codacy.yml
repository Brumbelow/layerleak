# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow performs a Codacy security scan, integrates the results with
# GitHub Advanced Security code scanning, and uploads Go test coverage to
# Codacy. For more information on the Codacy security scan action, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.
# For more information on Codacy Coverage Reporter, see
# https://docs.codacy.com/coverage-reporter/.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      # Post-process SARIF so each of Codacy's per-tool runs gets a unique
      # automationDetails.id (github/codeql-action@v4 enforces "one run per
      # category"), drop runs that carry no results, and split the remainder
      # into files of at most 20 runs because GitHub rejects larger uploads
      # ("rejecting SARIF, as there are more runs than allowed").
      # See https://github.com/codacy/codacy-analysis-cli-action/issues/142
      - name: Combine SARIF runs by tool name and split into uploadable chunks
        id: sarif
        if: hashFiles('results.sarif') != ''
        shell: bash
        run: |
          set -euo pipefail
          jq '.runs |= (
            group_by(.tool.driver.name) |
            map(
              . as $group |
              .[0] as $first |
              $first + {
                "automationDetails": (($first.automationDetails // {}) + { "id": ("Codacy/" + $first.tool.driver.name) }),
                "results": ([$group[].results[]] | unique),
                "artifacts": ([$group[].artifacts // [] | .[]] | unique),
                "invocations": [
                  (
                    reduce $group[].invocations[] as $item ({}; . + $item) |
                    . + { "executionSuccessful": ([$group[].invocations[].executionSuccessful] | all) }
                  )
                ]
              }
            ) |
            map(select((.results | length) > 0))
          )' results.sarif > results-combined.sarif
          total="$(jq '.runs | length' results-combined.sarif)"
          echo "Codacy reported ${total} tool run(s) with results."
          mkdir -p sarif-chunks
          chunks=0
          for ((start = 0; start < total; start += 20)); do
            chunks=$((chunks + 1))
            if (( chunks > 3 )); then
              echo "More than 60 SARIF runs; extend the upload steps below." >&2
              exit 1
            fi
            jq --argjson start "${start}" '.runs |= .[$start:$start + 20]' results-combined.sarif \
              > "sarif-chunks/codacy-${chunks}.sarif"
          done
          echo "chunks=${chunks}" >> "${GITHUB_OUTPUT}"

      - name: Upload SARIF results (chunk 1)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: steps.sarif.outputs.chunks >= 1
        with:
          sarif_file: sarif-chunks/codacy-1.sarif
          category: Codacy
          wait-for-processing: true

      - name: Upload SARIF results (chunk 2)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: steps.sarif.outputs.chunks >= 2
        with:
          sarif_file: sarif-chunks/codacy-2.sarif
          category: Codacy/2
          wait-for-processing: true

      - name: Upload SARIF results (chunk 3)
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: steps.sarif.outputs.chunks >= 3
        with:
          sarif_file: sarif-chunks/codacy-3.sarif
          category: Codacy/3
          wait-for-processing: true

  codacy-coverage:
    name: Codacy Coverage
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: layerleak_test
          POSTGRES_USER: layerleak
          POSTGRES_PASSWORD: layerleak-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U layerleak -d layerleak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GOFLAGS: -mod=readonly
      LAYERLEAK_TEST_DATABASE_URL: postgres://layerleak:layerleak-test-only@127.0.0.1:5432/layerleak_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Go coverage report
        shell: bash
        run: |
          set -euo pipefail
          # The full suite, including the PostgreSQL integration tests, so the
          # published coverage reflects the storage layer as well.
          go test ./... -count=1 -covermode=atomic -coverprofile=coverage.out
          test -s coverage.out

      - name: Upload coverage to Codacy
        shell: bash
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          CODACY_REPORTER_VERSION: "14.1.3"
          CODACY_REPORTER_SHA512: 73a6c93fc5db509fd0423d6e545759c3f61d8360ee12054e32a9277daab6add0da6c6639248f6ed6c0042366440293ebc0b6144325aef52c5d3d4b230d65eb17
          COVERAGE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${CODACY_PROJECT_TOKEN}" ]]; then
            echo "CODACY_PROJECT_TOKEN is required for coverage uploads." >&2
            exit 1
          fi

          reporter="${RUNNER_TEMP}/codacy-coverage-reporter"
          curl --fail --location --silent --show-error \
            --output "${reporter}" \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${CODACY_REPORTER_VERSION}/codacy-coverage-reporter-linux"
          echo "${CODACY_REPORTER_SHA512}  ${reporter}" | sha512sum --check
          chmod +x "${reporter}"
          "${reporter}" report \
            --commit-uuid "${COVERAGE_COMMIT}" \
            --force-coverage-parser go \
            -r coverage.out
