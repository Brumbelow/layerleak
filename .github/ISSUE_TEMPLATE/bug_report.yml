name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post live secrets, private registry URLs, credentials, or
        unredacted findings. Security issues belong in a private report under
        the Security tab or at admin@brumbelow.org.
  - type: input
    id: version
    attributes:
      label: Layerleak version
      description: Output of `layerleak version` (or `layerleak --version`), or the container image digest.
      placeholder: layerleak version v3.0.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - go install github.com/brumbelow/layerleak/v3@...
        - Built from source
        - Container image (ghcr.io/brumbelow/layerleak)
        - Other
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS and architecture
      placeholder: Ubuntu 24.04, linux/amd64
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: PostgreSQL and schema version, if applicable
      placeholder: PostgreSQL 16.15, schema 0004
  - type: textarea
    id: command
    attributes:
      label: Command or request
      description: The smallest redacted command or HTTP request that reproduces the problem. Prefer a public fixture image or a synthetic digest.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code, the top-level result `status`, the coverage summary, and the API `X-Request-ID` when available. Redact all secret material.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Platform, media types, limit overrides, migration path, logs, or a minimal synthetic fixture. Say whether `--allow-partial`, `--all-tags`, `--fail-on`, private-host allowlists, a proxy, or raw-secret persistence were in use.
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction
      options:
        - label: I have removed every secret value, credential and private hostname from this report.
          required: true
