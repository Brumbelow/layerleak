# golangci-lint v2 configuration. Run `make lint` or `golangci-lint run ./...`.
# The revive rule list mirrors revive.toml (default rules plus early-return and
# bool-literal-in-expr, without exported and package-comments).
version: "2"

run:
  timeout: 10m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - misspell
    - revive
  settings:
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: bool-literal-in-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      # Tests hold synthetic credential shapes, world-readable fixtures and
      # plain-HTTP servers by design.
      - path: _test\.go
        linters:
          - gosec

issues:
  # Report every issue; the defaults hide repeats of the same message.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
