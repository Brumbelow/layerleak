<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>layerleak</title>
    <meta
      name="description"
      content="Redirecting to the layerleak GitHub repository. Documentation lives under /docs."
    />
    <meta http-equiv="refresh" content="0; url=https://github.com/brumbelow/layerleak" />
    <link rel="canonical" href="https://github.com/brumbelow/layerleak" />
    <script>
      window.location.replace("https://github.com/brumbelow/layerleak");
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f4efe5;
        color: #1a1713;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      article {
        max-width: 36rem;
        padding: 2rem;
        border: 1px solid rgba(26, 23, 19, 0.12);
        border-radius: 1rem;
        background: rgba(255, 251, 244, 0.92);
        box-shadow: 0 24px 48px rgba(26, 23, 19, 0.08);
      }

      h1 {
        margin-top: 0;
      }

      a {
        color: #8f2d12;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #11161c;
          color: #e8edf2;
        }

        article {
          border-color: rgba(232, 237, 242, 0.16);
          background: #1a2129;
          box-shadow: none;
        }

        a {
          color: #e8825f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>Redirecting to GitHub</h1>
        <p>
          The root Pages URL now redirects to
          <a href="https://github.com/brumbelow/layerleak">github.com/brumbelow/layerleak</a>.
        </p>
        <p>
          Documentation for the 3.0.0 line lives at
          <a href="./docs/">brumbelow.github.io/layerleak/docs</a>, with the
          <a href="./docs/demo/">browser replay of a real scan</a> and the
          <a href="./docs/openapi.yaml">OpenAPI specification</a> beside it.
        </p>
      </article>
    </main>
  </body>
</html>
